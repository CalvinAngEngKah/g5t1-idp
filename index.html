<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Savenow — Finance Made Easy</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0F172A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Savenow">
  
  <!-- Native iOS Typography (San Francisco / SF Pro system font stack) -->
  
  <!-- ==============================================================
       MAZE A/B TESTING & USABILITY TRACKING INTEGRATION
       Reads API key from localStorage or URL parameter (?mazeKey=...)
       ============================================================== -->
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var urlKey = params.get('mazeKey');
      var storedKey = localStorage.getItem('savenow_maze_api_key');
      var mazeKey = urlKey || storedKey || 'YOUR_MAZE_API_KEY';

      // Save if provided via URL
      if (urlKey) {
        localStorage.setItem('savenow_maze_api_key', urlKey);
      }
      window.__MAZE_API_KEY__ = mazeKey;

      // Universal Maze Tracking Snippet
      (function (m, a, z, e) {
        var s, t, u, v;
        try { t = m.sessionStorage.getItem('maze-us'); } catch (err) {}
        if (!t) {
          t = new Date().getTime();
          try { m.sessionStorage.setItem('maze-us', t); } catch (err) {}
        }
        u = document.currentScript || (function () {
          var w = document.getElementsByTagName('script');
          return w[w.length - 1];
        })();
        v = u && u.nonce;
        s = a.createElement('script');
        s.src = z + '?apiKey=' + e;
        s.async = true;
        if (v) s.setAttribute('nonce', v);
        a.getElementsByTagName('head')[0].appendChild(s);
        m.mazeUniversalSnippetApiKey = e;
      })(window, document, 'https://snippet.maze.co/maze-universal-loader.js', mazeKey);
    })();
  </script>

  <!-- iOS HIG Design System Tokens & Base Component Styles -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">

  <!-- Screen-specific modular CSS files -->
  <link rel="stylesheet" href="src/screens/onboarding/onboarding.css">
  <link rel="stylesheet" href="src/screens/setup-banks/setup-banks.css">
  <link rel="stylesheet" href="src/screens/setup-goal/setup-goal.css">
  <link rel="stylesheet" href="src/screens/setup-recurring/setup-recurring.css">
  <link rel="stylesheet" href="src/screens/setup-socials/setup-socials.css">
  <link rel="stylesheet" href="src/screens/home/home.css">
  <link rel="stylesheet" href="src/screens/insights/insights.css">
  <link rel="stylesheet" href="src/screens/social/social.css">
  <link rel="stylesheet" href="src/screens/settings/settings.css">
</head>
<body data-theme="light">

  <div id="app-viewport-wrapper">

    <!-- Mobile Edge-to-Edge Container -->
    <main class="mobile-app-root" id="mobile-app">



      <!-- Floating Theme Switcher -->
      <div class="app-micro-header">
        <button class="theme-micro-toggle" id="toggle-theme-btn" aria-label="Toggle theme">
          <span class="theme-icon">&#9790;</span>
          <span class="theme-label">Dark</span>
        </button>
      </div>

      <!-- Main Screens Viewport: Mounted dynamically by App.router -->
      <div class="screens-viewport" id="screens-viewport"></div>

      <!-- ==============================================================
           iOS TAB BAR (UITabBar with SF Symbols & Translucent Blur)
           ============================================================== -->
      <nav class="bottom-nav-bar" id="app-bottom-nav">
        <!-- 1. Home (house.fill) -->
        <button class="nav-tab-btn active" data-tab="home" data-goto="screen-home" id="tab-btn-home">
          <svg class="nav-tab-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2.1L1 12h3v9a1 1 0 0 0 1 1h5v-6h4v6h5a1 1 0 0 0 1-1v-9h3L12 2.1z"/>
          </svg>
          <span>Home</span>
        </button>

        <!-- 2. Insights (chart.pie.fill) -->
        <button class="nav-tab-btn" data-tab="insights" data-goto="screen-insights" id="tab-btn-insights">
          <svg class="nav-tab-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M11 2v10h10A10 10 0 0 0 11 2zm2 10.5V22a10 10 0 0 0 8.5-8.5H13zM9.5 4A10 10 0 1 0 20 14.5H9.5V4z"/>
          </svg>
          <span>Insights</span>
        </button>

        <!-- 3. Add Button (Elevated Center Circle with SF Symbol plus) -->
        <button class="nav-tab-btn nav-center-add" id="nav-add-expense-btn" aria-label="Add transaction">
          <div class="nav-add-circle">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </div>
          <span style="margin-top: 2px;">Add</span>
        </button>

        <!-- 4. Social (person.2.fill) -->
        <button class="nav-tab-btn" data-tab="social" data-goto="screen-social" id="tab-btn-social">
          <svg class="nav-tab-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm6.5 1a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM9 13c-2.67 0-8 1.34-8 4v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2c0-2.66-5.33-4-8-4zm6.5 1c-.34 0-.74.03-1.16.08 1.02.77 1.66 1.83 1.66 2.92v2h4a1 1 0 0 0 1-1v-1c0-1.66-3.33-3-5.5-3z"/>
          </svg>
          <span>Social</span>
        </button>

        <!-- 5. Settings (gearshape.fill) -->
        <button class="nav-tab-btn" data-tab="settings" data-goto="screen-settings" id="tab-btn-settings">
          <svg class="nav-tab-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54A.48.48 0 0 0 14 2h-4a.48.48 0 0 0-.48.41l-.38 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.62 8.47a.49.49 0 0 0 .12.61l2.03 1.58c-.05.3-.07.63-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h4c.24 0 .44-.17.48-.41l.38-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
          </svg>
          <span>Settings</span>
        </button>

        <!-- Centered iOS Home Indicator inside Tab Bar safe area -->
        <div class="ios-home-indicator-wrap">
          <div class="ios-home-indicator"></div>
        </div>
      </nav>

      <!-- MODAL 1: BANK AUTH SPLASH (DBS Splash) -->
      <div class="bank-auth-splash" id="bank-auth-splash">
        <div class="bank-auth-banner">
          <div class="bank-auth-black-side">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path d="M12 0L15.5 8.5L24 12L15.5 15.5L12 24L8.5 15.5L0 12L8.5 8.5L12 0Z" fill="#E11D48"/>
            </svg>
            <span>DBS</span>
          </div>
          <div class="bank-auth-gray-side">
            <span>Live more,</span>
            <span>Bank less</span>
          </div>
        </div>
        <div class="auth-spinner"></div>
        <div class="auth-status-text" id="bank-auth-status-text">Connecting to DBS Bank...</div>
      </div>

      <!-- MODAL 2: CATEGORY PICKER SHEET (iOS Detent Sheet with SF Symbols) -->
      <div class="modal-overlay" id="category-modal">
        <div class="bottom-sheet">
          <div class="sheet-handle-bar"></div>
          <div class="sheet-title">Select Category</div>
          <div class="sheet-subtitle">Pick the category for this recurring charge</div>

          <div class="ios-inset-group" style="margin-top: 14px;">
            <div class="ios-list-row category-option-item" data-cat="MUSIC">
              <div class="ios-row-left">
                <div class="ios-icon-box purple">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                  </svg>
                </div>
                <div class="ios-row-title">MUSIC</div>
              </div>
              <svg class="ios-disclosure" viewBox="0 0 8 13" fill="none" stroke="currentColor">
                <path d="M1.5 1.5L6.5 6.5L1.5 11.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>

            <div class="ios-list-row category-option-item" data-cat="RENT">
              <div class="ios-row-left">
                <div class="ios-icon-box emerald">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2.1L1 12h3v9a1 1 0 0 0 1 1h5v-6h4v6h5a1 1 0 0 0 1-1v-9h3L12 2.1z"/>
                  </svg>
                </div>
                <div class="ios-row-title">RENT</div>
              </div>
              <svg class="ios-disclosure" viewBox="0 0 8 13" fill="none" stroke="currentColor">
                <path d="M1.5 1.5L6.5 6.5L1.5 11.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>

            <div class="ios-list-row category-option-item" data-cat="TV & STREAMING">
              <div class="ios-row-left">
                <div class="ios-icon-box orange">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 14H3V5h18v12zM10 8l6 4-6 4V8z"/>
                  </svg>
                </div>
                <div class="ios-row-title">TV &amp; STREAMING</div>
              </div>
              <svg class="ios-disclosure" viewBox="0 0 8 13" fill="none" stroke="currentColor">
                <path d="M1.5 1.5L6.5 6.5L1.5 11.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>

            <div class="ios-list-row category-option-item" data-cat="SUBSCRIPTIONS">
              <div class="ios-row-left">
                <div class="ios-icon-box blue">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
                  </svg>
                </div>
                <div class="ios-row-title">SUBSCRIPTIONS</div>
              </div>
              <svg class="ios-disclosure" viewBox="0 0 8 13" fill="none" stroke="currentColor">
                <path d="M1.5 1.5L6.5 6.5L1.5 11.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>

            <div class="ios-list-row category-option-item" data-cat="UTILITIES">
              <div class="ios-row-left">
                <div class="ios-icon-box orange">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M11 21h-1l1-7H7.5c-.58 0-.57-.32-.38-.66.19-.34.05-.08.08-.14L13 3h1l-1 7h3.5c.49 0 .56.33.47.51l-.07.15L11 21z"/>
                  </svg>
                </div>
                <div class="ios-row-title">UTILITIES</div>
              </div>
              <svg class="ios-disclosure" viewBox="0 0 8 13" fill="none" stroke="currentColor">
                <path d="M1.5 1.5L6.5 6.5L1.5 11.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>

            <div class="ios-list-row category-option-item" data-cat="GYM">
              <div class="ios-row-left">
                <div class="ios-icon-box emerald">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20.57 14.86L22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 5.57 4.14 4.14 2.71 2.71 4.14l1.43 1.43L2 7.71l1.43 1.43L2 10.57 3.43 12 7 8.43 15.57 17 12 20.57 13.43 22l1.43-1.43 1.43 1.43 2.14-2.14 1.43 1.43 1.43-1.43-1.43-1.43 1.43-1.43z"/>
                  </svg>
                </div>
                <div class="ios-row-title">GYM</div>
              </div>
              <svg class="ios-disclosure" viewBox="0 0 8 13" fill="none" stroke="currentColor">
                <path d="M1.5 1.5L6.5 6.5L1.5 11.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </div>
        </div>
      </div>

      <!-- MODAL 3: QUICK ADD TRANSACTION (iOS Detent Sheet) -->
      <div class="modal-overlay" id="add-expense-modal">
        <div class="bottom-sheet">
          <div class="sheet-handle-bar"></div>
          <div class="sheet-title">Add Transaction</div>
          <div class="sheet-subtitle">Log spending against your $20 daily limit</div>

          <div class="input-outline-box" style="margin-top: 12px;">
            <span class="input-outline-label">PURCHASE DESCRIPTION</span>
            <input type="text" class="input-outline-field" id="quick-exp-title" placeholder="e.g. Iced Latte, Lunch Bowl">
          </div>

          <div class="input-outline-box">
            <span class="input-outline-label">AMOUNT ($)</span>
            <input type="number" step="0.10" class="input-outline-field" id="quick-exp-amt" placeholder="4.50">
          </div>

          <div class="input-outline-box">
            <span class="input-outline-label">CATEGORY</span>
            <select class="input-outline-field" id="quick-exp-cat" style="background: transparent; border: none; outline: none; width: 100%;">
              <option value="food">Food &amp; Dining (34%)</option>
              <option value="transport">Transport (22%)</option>
              <option value="shopping">Shopping (20%)</option>
              <option value="bills">Bills &amp; Subscriptions (14%)</option>
              <option value="other">Other (10%)</option>
            </select>
          </div>

          <button class="btn btn-primary" id="confirm-add-expense-btn" style="width: 100%; height: 50px; margin-top: 10px; font-size: 17px;">Record Expense</button>
        </div>
      </div>

      <!-- iOS Dynamic Notification / Island Notice -->
      <div class="toast-notice" id="app-toast"></div>

    </main><!-- /.mobile-app-root -->

  </div><!-- /#app-viewport-wrapper -->

  <!-- Core Architecture (State, Router, Maze A/B Testing) -->
  <script src="src/core/state.js"></script>
  <script src="src/core/router.js"></script>
  <script src="src/core/maze.js"></script>

  <!-- Modular Screens (Independently editable by teammates) -->
  <script src="src/screens/onboarding/onboarding.js"></script>
  <script src="src/screens/setup-banks/setup-banks.js"></script>
  <script src="src/screens/setup-goal/setup-goal.js"></script>
  <script src="src/screens/setup-recurring/setup-recurring.js"></script>
  <script src="src/screens/setup-socials/setup-socials.js"></script>
  <script src="src/screens/home/home.js"></script>
  <script src="src/screens/insights/insights.js"></script>
  <script src="src/screens/social/social.js"></script>
  <script src="src/screens/settings/settings.js"></script>

  <!-- App Bootstrap -->
  <script src="src/main.js"></script>
</body>
</html>
